[project]
name = "kinase-open"
version = "0.2.0"
description = "JAK-family affinity benchmark with audited selectivity and uncertainty evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "torch==2.2.2",
    "rdkit==2025.9.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
